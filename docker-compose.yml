services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_consultant
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      retries: 20

  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/ai_consultant
      NODE_ENV: production
    ports: ["3000:3000"]
    volumes: [uploads:/app/server/uploads]
    depends_on:
      db: { condition: service_healthy }

volumes:
  pgdata:
  uploads:
