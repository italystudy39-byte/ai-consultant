<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI-консультант</title>
<style>
  :root { --accent: #4f46e5; --bg: #fff; --fg: #111827; --muted: #6b7280; --bubble: #f3f4f6; --border: #e5e7eb; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .app { display: flex; flex-direction: column; height: 100%; }
  header { display: flex; align-items: center; gap: 10px; padding: 14px 16px; background: var(--accent); color: #fff; flex-shrink: 0; }
  .avatar { width: 36px; height: 36px; border-radius: 50%; background: rgba(255,255,255,.2); display: grid; place-items: center; font-weight: 600; }
  .title { flex: 1; min-width: 0; }
  .title b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .title small { opacity: .85; font-size: 12px; }
  .close { background: none; border: 0; color: #fff; cursor: pointer; padding: 6px; border-radius: 8px; line-height: 0; }
  .close:hover { background: rgba(255,255,255,.15); }
  .close:focus-visible { outline: 2px solid #fff; }
  main { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; scroll-behavior: smooth; }
  .msg { max-width: 85%; padding: 9px 13px; border-radius: 16px; word-wrap: break-word; overflow-wrap: anywhere; white-space: normal; animation: in .18s ease-out; }
  .msg.bot { background: var(--bubble); align-self: flex-start; border-bottom-left-radius: 4px; }
  .msg.user { background: var(--accent); color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
  .msg.err { background: #fef2f2; color: #991b1b; }
  .msg a { color: inherit; }
  .msg ul { margin: 4px 0; padding-left: 18px; }
  @keyframes in { from { opacity: 0; transform: translateY(4px); } }
  .typing { display: inline-flex; gap: 4px; padding: 12px 14px; }
  .typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite; }
  .typing i:nth-child(2) { animation-delay: .2s; } .typing i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
  .lead { align-self: stretch; border: 1px solid var(--border); border-radius: 12px; padding: 12px; display: grid; gap: 8px; background: #fafafa; }
  .lead p { margin: 0; font-size: 14px; }
  .lead input { width: 100%; padding: 9px 11px; border: 1px solid var(--border); border-radius: 8px; font: inherit; }
  .lead .row { display: flex; gap: 8px; }
  .btn { background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: 9px 14px; font: inherit; cursor: pointer; }
  .btn.ghost { background: none; color: var(--muted); }
  .btn:disabled { opacity: .5; cursor: default; }
  .offer { align-self: flex-start; background: none; border: 1px solid var(--accent); color: var(--accent); border-radius: 999px; padding: 6px 12px; font: inherit; font-size: 14px; cursor: pointer; }
  footer { border-top: 1px solid var(--border); padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); flex-shrink: 0; }
  form.composer { display: flex; gap: 8px; align-items: flex-end; }
  textarea { flex: 1; resize: none; border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; font: inherit; max-height: 120px; min-height: 42px; outline: none; }
  textarea:focus { border-color: var(--accent); }
  .send { width: 42px; height: 42px; flex-shrink: 0; border-radius: 50%; border: 0; background: var(--accent); color: #fff; cursor: pointer; display: grid; place-items: center; }
  .send:disabled { opacity: .45; cursor: default; }
  .brand { text-align: center; font-size: 11px; color: var(--muted); margin-top: 6px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  @media (max-width: 480px) { textarea { font-size: 16px; } /* без авто-зума на iOS */ }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="avatar" id="avatar">AI</div>
    <div class="title"><b id="botName">AI-консультант</b><small id="status">онлайн</small></div>
    <button class="close" id="close" type="button" aria-label="Закрыть">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
  </header>
  <main id="log" role="log" aria-live="polite" aria-relevant="additions"></main>
  <footer>
    <form class="composer" id="form">
      <label class="sr" for="input">Сообщение</label>
      <textarea id="input" rows="1" maxlength="2000" placeholder="Напишите вопрос…"></textarea>
      <button class="send" id="send" type="submit" aria-label="Отправить" disabled>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4z"/></svg>
      </button>
    </form>
    <div class="brand" id="brand">AI может ошибаться</div>
  </footer>
</div>
<script src="chat.js"></script>
</body>
</html>
